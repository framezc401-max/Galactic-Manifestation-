name: CI/CD Pipeline

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events for the main branch
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Environment variables
env:
  NODE_ENV: production

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Checkout and build job
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Setup Node.js environment
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        run: |
          npm ci --if-present
          npm install --if-present

      # Run linting
      - name: Lint code
        run: |
          npm run lint --if-present || echo "No lint script defined"

      # Run tests
      - name: Run tests
        run: |
          npm test --if-present || echo "No test script defined"

      # Build project
      - name: Build project
        run: |
          npm run build --if-present || echo "No build script defined"

      # Upload test coverage (optional)
      - name: Upload coverage reports
        if: always()
        uses: codecov/codecov-action@v3
        with:
          fail_ci_if_error: false

  # Code quality check
  quality-check:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --if-present

      - name: Security audit
        run: npm audit --if-present || echo "No audit available"

  # Deployment job (optional - configure as needed)
  deploy:
    name: Deploy
    needs: [build, quality-check]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy notification
        run: echo "Ready for deployment to production"
